<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container" style="max-width:600px;">
        <div class="card">
            <h2>Update Profile Attributes Form</h2><br>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">Save Fields Profile Data</button>
                <a href="{% url 'users:profile' %}" class="btn btn-secondary">Discard Changes</a>
            </form>
        </div>
    </div>
</body>
</html>
